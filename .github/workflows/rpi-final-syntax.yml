name: RPI Final Syntax Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[rpi-final-syntax]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair portal login and password change code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s2=re.sub(r'\basync(?:\s+async)+\s+function\s+(handleGlobalLogin|login)\s*\(\)', r'async function \1()', s)
          marker='''      async function resetUserPassword() {\n        const role = document.getElementById("resetUserRole").value;'''
          replacement='''      async function resetUserPassword() {\n        const role = document.getElementById("resetUserRole").value;\n        const oldPassword = document.getElementById("resetUserOldPassword").value;'''
          if marker in s2 and 'const oldPassword = document.getElementById("resetUserOldPassword").value;' not in s2[s2.find(marker):s2.find(marker)+500]:
              s2=s2.replace(marker,replacement,1)
          if s2==s:
              print('No repair needed')
          else:
              p.write_text(s2,encoding='utf-8')
              print('Portal login/password code repaired')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Repair password change [rpi-final-syntax]'
          git push origin main
