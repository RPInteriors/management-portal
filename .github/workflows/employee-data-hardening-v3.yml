name: Employee Data Hardening V4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository
        run: |
          test -f index.html
          test -f .github/workflows/employee-data-hardening-v3.yml
          echo "Repository validation passed"
