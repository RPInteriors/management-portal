name: RPI Employee Protection

on:
  push:

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply production security hardening
        run: python3 scripts/harden_production_v2.py
      - name: Verify production hardening
        run: |
          grep -q 'function readEmployeeLocalBackup()' index.html
          grep -q 'function writeEmployeeLocalBackup(employeeList)' index.html
          grep -q 'BLOCKED an empty employee overwrite' index.html
          grep -q 'database.ref("portalData/employees")' index.html
          grep -q 'auth.signInWithEmailAndPassword(email, pass)' index.html
          ! grep -q 'im@ceo!26' index.html
          ! grep -q 'im_the_admin+85' index.html
          ! grep -q 'wise_supervisor%94' index.html
          ! grep -q 'data.userProfiles' index.html
          echo 'Production security hardening verification passed'
      - name: Commit production hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html backups
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden production authentication and employee data'
          git push origin main
