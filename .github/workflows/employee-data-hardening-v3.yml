name: RPI Employee Protection

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/employee-data-hardening-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch portal
        run: python3 scripts/harden_employee.py
      - name: Verify protection
        run: |
          grep -q 'function readEmployeeLocalBackup()' index.html
          grep -q 'function writeEmployeeLocalBackup(employeeList)' index.html
          grep -q 'BLOCKED an empty employee overwrite' index.html
          grep -q 'database.ref("portalData/employees")' index.html
          echo 'Employee protection verification passed'
      - name: Commit protection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html backups
          if git diff --cached --quiet; then
            echo 'No changes required'
          else
            git commit -m 'Protect employee data from accidental erasure'
            git push origin main
          fi
