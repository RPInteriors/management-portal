name: RPI Employee Protection

on:
  push:

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply final security hardening
        run: python3 scripts/finalize_security_v3.py
      - name: Harden credential recovery
        run: python3 scripts/credential_safety_v2.py
      - name: Verify final security hardening
        run: |
          grep -q 'function readEmployeeLocalBackup()' index.html
          grep -q 'function writeEmployeeLocalBackup(employeeList)' index.html
          grep -q 'BLOCKED an empty employee overwrite' index.html
          grep -q 'database.ref("portalData/employees")' index.html
          grep -q 'verifyRolePasswordInFirebaseAuth(role, pass)' index.html
          grep -q 'verifyRolePasswordInFirebaseAuth("Administrator", pass)' index.html
          grep -q 'This recovery path is disabled for security.' index.html
          ! grep -q 'im@ceo!26' index.html
          ! grep -q 'im_the_admin+85' index.html
          ! grep -q 'wise_supervisor%94' index.html
          ! grep -q 'data.userProfiles' index.html
          ! grep -q 'userProfiles: USER_PROFILES' index.html
          echo 'FINAL SECURITY HARDENING VERIFICATION PASSED'
      - name: Commit final security hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html backups
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden credential recovery and employee data protection'
          git push origin main
