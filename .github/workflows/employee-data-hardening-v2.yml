name: Employee Data Hardening V2

on:
  push:
    branches: [main]
    paths:
      - '.github/employee-hardening-trigger.txt'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Protect employee storage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, subprocess, re
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          save=t.find('      function saveToLocalStorage() {')
          save_end=t.find('      function initUserProfilesSync() {', save)
          sync=t.find('      function initCloudSync() {')
          sync_end=t.find('      // --- AUTH LOGIC ---', sync)
          if min(save,save_end,sync,sync_end)<0: raise SystemExit('Safety check failed: storage functions not found')
          backup=Path('backups'); backup.mkdir(exist_ok=True)
          old=backup/f"index-before-hardening-{subprocess.check_output(['git','rev-parse','--short','HEAD'],text=True).strip()}.html"
          shutil.copy2(p,old)
          new_save='''      // --- STORAGE LOGIC ---
      function readEmployeeLocalBackup() {
        try {
          const raw = localStorage.getItem("RPI_employee_backup");
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) && parsed.length > 0 ? sortEmployeesById(parsed) : [];
        } catch (error) { console.warn("RPI employee backup read failed:", error); return []; }
      }
      function writeEmployeeLocalBackup(employeeList) {
        if (!Array.isArray(employeeList) || employeeList.length === 0) return;
        try { localStorage.setItem("RPI_employee_backup", JSON.stringify(sortEmployeesById(employeeList))); localStorage.setItem("RPI_employee_backup_time", new Date().toISOString()); }
        catch (error) { console.warn("RPI local employee backup failed:", error); }
      }
      function saveToLocalStorage() {
        let safeEmployees = Array.isArray(employees) ? sortEmployeesById(employees) : [];
        const backupEmployees = readEmployeeLocalBackup();
        if (safeEmployees.length === 0 && backupEmployees.length > 0) { safeEmployees = backupEmployees; employees = safeEmployees; }
        const updates = { projects, expenseRecords, materialRecords, userProfiles: USER_PROFILES };
        if (safeEmployees.length > 0) { employees = safeEmployees; updates.employees = safeEmployees; writeEmployeeLocalBackup(safeEmployees); }
        else console.warn("RPI protection: BLOCKED an empty employee overwrite. Employee data was not changed in Firebase.");
        return database.ref("portalData").update(updates).catch(error => { console.error("Cloud Sync Error:", error); throw error; });
      }

'''
          new_sync='''      function initCloudSync() {
        const employeeRef = database.ref("portalData/employees");
        employeeRef.on("value", snapshot => {
          const cloudEmployees = snapshot.val();
          if (Array.isArray(cloudEmployees) && cloudEmployees.length > 0) {
            employees = sortEmployeesById(cloudEmployees); writeEmployeeLocalBackup(employees);
          } else {
            const backupEmployees = readEmployeeLocalBackup();
            if (backupEmployees.length > 0) {
              employees = backupEmployees;
              employeeRef.set(employees).catch(error => console.error("RPI employee recovery write failed:", error));
            } else console.warn("RPI protection: no employee backup available; refusing empty overwrite.");
          }
          const activePage = Array.from(document.querySelectorAll(".page")).find(p => p.style.display === "block")?.id;
          if (activePage === "page1") renderEmployeeList();
          if (activePage === "page4") renderAdminPanel();
        });
        database.ref("portalData").on("value", snapshot => {
          const data=snapshot.val(); if (!data) return;
          projects=data.projects || []; expenseRecords=data.expenseRecords || []; materialRecords=data.materialRecords || [];
          USER_PROFILES={...DEFAULT_USER_PROFILES,...(data.userProfiles || {})}; normalizeProjectsData();
          const activePage=Array.from(document.querySelectorAll(".page")).find(p=>p.style.display==="block")?.id;
          if(activePage==="page1") renderEmployeeList(); if(activePage==="pageExpense") renderExpenses(); if(activePage==="pageMaterials") renderMaterials(); if(activePage==="page3") renderProjectDashboard(); if(activePage==="page4") renderAdminPanel();
        });
      }

'''
          t=t[:save]+new_save+t[save_end:]
          sync=t.find('      function initCloudSync() {'); sync_end=t.find('      // --- AUTH LOGIC ---',sync)
          t=t[:sync]+new_sync+t[sync_end:]
          p.write_text(t,encoding='utf-8')
          print('patched')
          PY
      - name: Validate
        run: |
          grep -q 'BLOCKED an empty employee overwrite' index.html
          grep -q 'database.ref("portalData/employees")' index.html
          grep -q 'RPI_employee_backup' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html backups
          git diff --cached --quiet || (git commit -m "Protect employee data from accidental erasure" && git push)
